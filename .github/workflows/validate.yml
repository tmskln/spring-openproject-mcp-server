name: Build and Validate

on:
  push:
    paths:
      - 'src/**'
      - 'pom.xml'
  workflow_dispatch:

jobs:
  mvn-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java + Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Validate build (mvn clean validate test)
        run: mvn -B clean validate test
