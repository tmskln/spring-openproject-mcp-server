name: Build & Push Docker Image (from Tag)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git Tag/Version (z.B. 0.2.0 or v0.2.0)"
        required: true
        type: string
      runtime:
        description: "Container runtime to publish"
        required: true
        default: jvm
        type: choice
        options:
          - jvm
          - native
      latest:
        description: "Update 'latest' tag?"
        required: true
        default: false
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [jvm, native]
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: ${{ matrix.runtime == 'native' && 'graalvm' || 'temurin' }}
          cache: maven

      - name: Maven Build and Test
        run: |
          if [ "${{ matrix.runtime }}" = "native" ]; then
            # For native, we only validate to keep CI fast (full native compile is done in build-and-push)
            mvn -B -Pnative validate
          else
            # For JVM, we run full verification including integration tests before release
            mvn -B verify
          fi

  build-and-push:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    env:
      IMAGE_NAME: docker.io/tmskln/spring-openproject-mcp-server

    steps:
      - name: Check Docker Hub secret exists
        run: |
          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "DOCKERHUB_TOKEN is missing"
            exit 1
          else
            echo "DOCKERHUB_TOKEN is set"
          fi

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}

      - name: Set PKG_VERSION (strip optional leading "v")
        id: ver
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          PKG_VERSION="${TAG#v}"
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          echo "pkg_version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Select Dockerfile and tag suffix
        shell: bash
        run: |
          if [ "${{ inputs.runtime }}" = "native" ]; then
            echo "DOCKERFILE_PATH=docker/Dockerfile.native-dist" >> "$GITHUB_ENV"
            echo "IMAGE_TAG_SUFFIX=-native" >> "$GITHUB_ENV"
          else
            echo "DOCKERFILE_PATH=docker/Dockerfile" >> "$GITHUB_ENV"
            echo "IMAGE_TAG_SUFFIX=" >> "$GITHUB_ENV"
          fi

      - name: Set up Java + Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.runtime == 'native' && 'graalvm' || 'temurin' }}
          java-version: "25"
          cache: maven

      - name: Build Artifact (Maven)
        run: |
          if [ "${{ inputs.runtime }}" = "native" ]; then
            mvn -B -Pnative -DskipTests clean native:compile
          else
            mvn -B -DskipTests clean package
          fi

      - name: Convert CycloneDX SBOM to SPDX
        shell: bash
        run: |
          set -euo pipefail
          test -f "./target/classes/META-INF/sbom/application.cdx.json"
          docker run --rm \
            -v "${PWD}/target/classes/META-INF/sbom:/work" \
            cyclonedx/cyclonedx-cli \
            convert \
            --input-file /work/application.cdx.json \
            --output-file /work/application.spdx.json \
            --output-format spdxjson

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: true
      
      - name: Set build date
        run: echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV
      
      - name: Build and Push single-arch image
        shell: bash
        run: |
          IMAGE_TAG="${IMAGE_NAME}:${PKG_VERSION}-${{ matrix.arch }}${IMAGE_TAG_SUFFIX}"

          docker buildx build \
            -f "${DOCKERFILE_PATH}" \
            -t "${IMAGE_TAG}" \
            --label "org.opencontainers.image.build-date=${BUILD_DATE}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${PKG_VERSION}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.created=${BUILD_DATE}" \
            --attest type=sbom,generator=docker/scout-sbom-indexer:latest \
            --platform linux/${{ matrix.arch }} \
            --push \
            .

  merge-manifests:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: docker.io/tmskln/spring-openproject-mcp-server
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set PKG_VERSION
        id: ver
        run: |
          TAG="${{ inputs.tag }}"
          PKG_VERSION="${TAG#v}"
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Set IMAGE_TAG_SUFFIX
        run: |
          if [ "${{ inputs.runtime }}" = "native" ]; then
            echo "IMAGE_TAG_SUFFIX=-native" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG_SUFFIX=" >> "$GITHUB_ENV"
          fi

      - name: Create and push multi-arch manifest
        run: |
          TAG="${IMAGE_NAME}:${PKG_VERSION}${IMAGE_TAG_SUFFIX}"
          docker buildx imagetools create -t "${TAG}" \
            "${IMAGE_NAME}:${PKG_VERSION}-amd64${IMAGE_TAG_SUFFIX}" \
            "${IMAGE_NAME}:${PKG_VERSION}-arm64${IMAGE_TAG_SUFFIX}"
          
          if [ "${{ inputs.latest }}" = "true" ]; then
            LATEST_TAG="${IMAGE_NAME}:latest${IMAGE_TAG_SUFFIX}"
            docker buildx imagetools create -t "${LATEST_TAG}" \
              "${IMAGE_NAME}:${PKG_VERSION}-amd64${IMAGE_TAG_SUFFIX}" \
              "${IMAGE_NAME}:${PKG_VERSION}-arm64${IMAGE_TAG_SUFFIX}"
          fi
